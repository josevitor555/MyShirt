<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="./css/shoppingPage.css">
    <link rel="stylesheet" href="./css/root.css">

    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <title> Shopping Page </title>
</head>
<body>
    <section id="cartPage">
        <table width="100%">
            <thead>
                <tr>
                    <td> Remover </td>
                    <td> Imagem </td>
                    <td> Produto </td>
                    <td> Preço </td>
                    <td> Quantidade </td>
                    <td> Subtotal </td>
                </tr>
            </thead>
            <tbody>
                <!-- Tabela gerada dinamicamente -->
            </tbody>
        </table>

        <div class="cart-empty-message" id="cart-empty-message">
            <h2> Sacola Vazia </h2>
            <p> Sua sacola de compras está vazia, retorne à pagina principal para adicionar mais itens </p>
        </div>
    </section>

    <section id="cart-add">
        <div id="coupon">
            <h3> Aplicar Cupom </h3>
            <div>
                <input type="text" placeholder="Código do Cupom">
                <button> Aplicar </button>
            </div>
            <div id="coupon-message" class="hidden"></div>
        </div>
        <div id="subtotal">
            <h3> Total do Carrinho </h3>
            <table>
                <tr>
                    <td> Subtotal do Carrinho </td>
                    <td id="cart-subtotal"> R$ 0.00 </td>
                </tr>
                <tr>
                    <td> Frete </td>
                    <td id="shipping"> Grátis </td>
                </tr>
                <tr>
                    <td> <strong> Total </strong> </td>
                    <td id="cart-total"> R$ 0.00 </td>
                </tr>
            </table>
            <div class="button-area">
                <button id="proceedToCheckout"> Proceder ao Checkout </button>
                <a href="http://localhost:3000"> Continue comprando </a>
            </div>
        </div>
    </section>

    <script src="./js/cart.js"></script>
</body>
</html>
